name: Android CI

on:
  push:
    branches:
      - feat/android-native
      - feat/adaptive-lowlight
      - main
  pull_request:
    branches:
      - main
      - feat/mobile-web
  workflow_dispatch:

permissions:
  contents: read

# Only test the newest commit on this development branch.
# Avoid redundant full Android SDK/Gradle builds on rapid UI iterations.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"
      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightvision-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
